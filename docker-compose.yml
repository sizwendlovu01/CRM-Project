# Enterprise SaaS CRM - complete local stack (all services free and open source).
#   docker compose up --build              -> web, api, postgres, redis, mailpit
#   docker compose --profile seed run --rm seed          -> optional demo data
#   docker compose --profile monitoring up -d            -> prometheus + grafana
# Copy .env.example to .env and set the secrets first.

name: enterprise-saas-crm

x-api-env: &api-env
  NODE_ENV: production
  PORT: 4000
  DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-crm}?schema=public
  REDIS_URL: redis://redis:6379
  APP_URL: ${APP_URL:-http://localhost:3000}
  CORS_ORIGINS: ${APP_URL:-http://localhost:3000}
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (32+ random characters)}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY: "true"
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  MAIL_FROM: ${MAIL_FROM:-Enterprise CRM <no-reply@crm.local>}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:4000:4000"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: infrastructure/docker/seed.Dockerfile
    environment:
      <<: *api-env
      NODE_ENV: development
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [api]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana-oss:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]

volumes:
  postgres-data:
  redis-data:
  grafana-data:
